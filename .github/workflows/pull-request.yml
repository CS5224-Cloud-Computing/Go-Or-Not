name: Pull Request Checks

on:
    pull_request:
        branches: [dev]

jobs:
    backend-checks:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./backend
        
        steps:
            - uses: actions/checkout@v5
            
            - uses: actions/setup-node@v5
              with:
                  node-version: '20'
                  cache: 'npm'
                  cache-dependency-path: backend/package-lock.json
            
            - name: Install dependencies
              run: npm ci
            
            - name: Lint
              run: npm run lint --if-present || echo "No lint script configured"
            
            - name: Type check
              run: npm run type-check --if-present || echo "No type-check script configured"
            
            - name: Test
              run: npm run test --if-present || echo "No test script configured"

    frontend-checks:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./frontend
        
        steps:
            - uses: actions/checkout@v5
            
            - uses: actions/setup-node@v5
              with:
                  node-version: '20'
                  cache: 'npm'
                  cache-dependency-path: frontend/package-lock.json
            
            - name: Install dependencies
              run: npm ci
            
            - name: Lint
              run: npm run lint --if-present || echo "No lint script configured"
            
            - name: Type check
              run: npm run type-check --if-present || echo "No type-check script configured"
            
            - name: Test
              run: npm run test --if-present || echo "No test script configured"
            
            - name: Build
              run: npm run build

